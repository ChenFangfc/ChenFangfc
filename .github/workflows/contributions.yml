name: Contribution chart

# Redraws assets/contrib-light.svg and assets/contrib-dark.svg from the
# contribution calendar once a day, and commits them only when they changed.
# The commit is authored by github-actions[bot], so it is not counted as one of
# Chen's contributions.
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draw the chart
        run: python3 scripts/contrib.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if it changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contrib-light.svg assets/contrib-dark.svg
          git diff --cached --quiet || { git commit -m 'Redraw the contribution chart'; git push; }
